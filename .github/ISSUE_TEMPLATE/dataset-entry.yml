# Generated by scripts/build.py from data/schema.json. Do not edit by hand.
name: "Propose a dataset entry"
description: "Propose a dataset for the UrbanProbe Datasets registry. Every field follows the published standard."
title: "Dataset entry: "
labels: ["datasets", "entry-proposal"]
body:
  - type: markdown
    attributes:
      value: "Proposals are reviewed against the [datasets standard](https://urbanprobe.com/standards.html#datasets). Fill every field. Answers such as \"to follow\" or \"TBD\" block a release; if something is not known yet, say what is missing and why."
  - type: input
    id: entry_title
    attributes:
      label: "Title"
      description: "Name of the dataset as it should appear in the registry."
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "One sentence, up to 280 characters, shown in the registry list."
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: "Authors"
      description: "Names, separated by commas."
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: "Links"
      description: "One per line: a label, then the URL. Include the code, data or weights, and any paper."
      placeholder: "Code — https://github.com/...\nPaper — https://arxiv.org/abs/..."
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: "Licence"
      description: "Licence of the released artifacts, e.g. MIT, Apache-2.0, CC BY 4.0."
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: "Access conditions"
      description: "Any conditions on access, and what may not be redistributed. Write 'None' if open."
    validations:
      required: false
  - type: textarea
    id: citation
    attributes:
      label: "Citation"
      description: "How the entry should be cited."
    validations:
      required: true
  - type: textarea
    id: geography_time
    attributes:
      label: "Coverage & time"
      description: "Extent, spatial unit or raster resolution, coordinate reference system, period covered, observation dates, and update cadence."
    validations:
      required: true
  - type: textarea
    id: variables_schema
    attributes:
      label: "Variables & schema"
      description: "Every field with its type, unit, allowed values, and missing-value convention."
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: "Source & collection"
      description: "Original providers, collection method, sampling, and the rights attached to each source."
    validations:
      required: true
  - type: textarea
    id: processing
    attributes:
      label: "Processing"
      description: "Cleaning, joining, aggregation, and derivation steps, with the code that performs them."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: "Validation & quality"
      description: "Completeness, consistency checks, comparison with reference data, and known error rates."
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: "Limitations"
      description: "Coverage gaps, biases, temporal mismatches, and uses the dataset does not support."
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: "I have the right to release everything linked above, and restricted data is described rather than redistributed."
          required: true
        - label: "The released artifacts reproduce the results reported in this proposal."
          required: true
