      label: "Title"
      description: "Name of the indicator as it should appear in the registry."
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "One sentence, up to 280 characters, shown in the registry list."
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: "Authors"
      description: "Names, separated by commas."
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: "Links"
      description: "One per line: a label, then the URL. Include the code, data or weights, and any paper."
      placeholder: "Code — https://github.com/...\nPaper — https://arxiv.org/abs/..."
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: "Licence"
      description: "Licence of the released artifacts, e.g. MIT, Apache-2.0, CC BY 4.0."
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: "Access conditions"
      description: "Any conditions on access, and what may not be redistributed. Write 'None' if open."
    validations:
      required: false
  - type: textarea
    id: citation
    attributes:
      label: "Citation"
      description: "How the entry should be cited."
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: "Definition & rationale"
      description: "What the indicator is meant to measure, the concept behind it, and why this operationalisation."
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: "Inputs"
      description: "The datasets it is computed from, with versions, and any parameters or thresholds used."
    validations:
      required: true
  - type: textarea
    id: processing
    attributes:
      label: "Computation"
      description: "The formula or algorithm, step by step, with the code that implements it."
    validations:
      required: true
  - type: textarea
    id: spatial_scale
    attributes:
      label: "Spatial unit & scale"
      description: "The unit the indicator is reported at, and how it behaves when aggregated or disaggregated."
    validations:
      required: true
  - type: textarea
    id: geography_time
    attributes:
      label: "Coverage & time"
      description: "Places and periods for which values are released."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: "Validation"
      description: "Agreement with ground truth, surveys, or established measures, and the results of those comparisons."
    validations:
      required: true
  - type: textarea
    id: sensitivity
    attributes:
      label: "Sensitivity & uncertainty"
      description: "How the indicator responds to parameter choices and input errors, and how uncertainty is reported."
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: "Limitations & misuse"
      description: "Contexts where the indicator is not valid, and interpretations it does not support."
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: "I have the right to release everything linked above, and restricted data is described rather than redistributed."
          required: true
        - label: "The released artifacts reproduce the results reported in this proposal."
          required: true
