name: "Propose a indicator entry"
description: "Propose a indicator for the UrbanProbe Indicators registry. Every field follows the published standard."
title: "Indicator entry: "
labels: ["indicators", "entry-proposal"]
body:
  - type: markdown
    attributes:
      value: "Proposals are reviewed against the [indicators standard](https://urbanprobe.com/standards.html#indicators). Fill every field. Answers such as \"to follow\" or \"TBD\" block a release; if something is not known yet, say what is missing and why."
  - type: input
