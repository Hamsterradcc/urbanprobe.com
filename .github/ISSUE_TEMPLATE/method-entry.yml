# Generated by scripts/build.py from data/schema.json. Do not edit by hand.
name: "Propose a method entry"
description: "Propose a method for the UrbanProbe Methods registry. Every field follows the published standard."
title: "Method entry: "
labels: ["methods", "entry-proposal"]
body:
  - type: markdown
    attributes:
      value: "Proposals are reviewed against the [methods standard](https://urbanprobe.com/standards.html#methods). Fill every field. Answers such as \"to follow\" or \"TBD\" block a release; if something is not known yet, say what is missing and why."
  - type: input
    id: entry_title
    attributes:
      label: "Title"
      description: "Name of the method as it should appear in the registry."
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "One sentence, up to 280 characters, shown in the registry list."
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: "Authors"
      description: "Names, separated by commas."
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: "Links"
      description: "One per line: a label, then the URL. Include the code, data or weights, and any paper."
      placeholder: "Code — https://github.com/...\nPaper — https://arxiv.org/abs/..."
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: "Licence"
      description: "Licence of the released artifacts, e.g. MIT, Apache-2.0, CC BY 4.0."
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: "Access conditions"
      description: "Any conditions on access, and what may not be redistributed. Write 'None' if open."
    validations:
      required: false
  - type: textarea
    id: citation
    attributes:
      label: "Citation"
      description: "How the entry should be cited."
    validations:
      required: true
  - type: textarea
    id: problem_users
    attributes:
      label: "Problem & intended users"
      description: "The urban question the method answers and who is expected to run it."
    validations:
      required: true
  - type: textarea
    id: inputs_outputs
    attributes:
      label: "Inputs & outputs"
      description: "Required inputs with formats and sources, and the outputs produced with their schema."
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: "Data sources"
      description: "Data the method was developed and tested on, and the rights attached to it."
    validations:
      required: true
  - type: textarea
    id: processing
    attributes:
      label: "Steps & dependencies"
      description: "The pipeline in order, with software dependencies and their versions."
    validations:
      required: true
  - type: textarea
    id: installation_runtime
    attributes:
      label: "Installation & runtime"
      description: "How to set up the environment, expected run time, and hardware requirements."
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: "Example & test data"
      description: "A worked example with small test data that reproduces a published result."
    validations:
      required: true
  - type: textarea
    id: geography_time
    attributes:
      label: "Tested geography"
      description: "Places and periods where the method has been applied and checked."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: "Validation"
      description: "How outputs were checked, including comparison with alternative methods where they exist."
    validations:
      required: true
  - type: textarea
    id: maintenance
    attributes:
      label: "Maintenance status"
      description: "Whether the method is maintained, who maintains it, and known open issues."
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: "Limitations"
      description: "Known gaps, biases, and misuse risks."
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: "I have the right to release everything linked above, and restricted data is described rather than redistributed."
          required: true
        - label: "The released artifacts reproduce the results reported in this proposal."
          required: true
