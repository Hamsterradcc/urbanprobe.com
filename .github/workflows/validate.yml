name: Validate registry

# Checks that data/registry.json follows data/schema.json and the published standard,
# and that the generated field lists and issue forms are in sync with the schema.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install "jsonschema>=4.18"
      - name: Generated content is up to date
        run: python scripts/build.py --check
      - name: Registry data is valid
        run: python scripts/validate.py
